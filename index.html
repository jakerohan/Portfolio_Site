<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Professional Photography Portfolio - Underwater, Landscapes, Portraits, and Macro Nature">
    <title>Photography Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="site-header">
        <nav class="nav-container">
            <h1 class="site-title">Jake's Portfolio - Site under construction</h1>
            <div class="nav-links">
                <a href="#gallery" class="nav-link">Gallery</a>
                <a href="#about" class="nav-link">About</a>
                <a href="#contact" class="nav-link">Contact</a>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h2 class="hero-title">Visual Stories</h2>
            <p class="hero-subtitle">insert tagline</p>
        </div>
    </section>

    <!-- Gallery Section -->
    <main id="gallery" class="gallery-container">
        <div class="gallery-grid" id="galleryGrid">
            <!-- Images will be dynamically loaded here by JavaScript -->
        </div>
    </main>

    <!-- About Section -->
    <section id="about" class="about-section">
        <div class="about-content">
            <h2>About</h2>
            <p>insert About Me</p>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="contact-section">
        <div class="contact-content">
            <h2>Get In Touch</h2>
            <p>add email and socials</p>
        </div>
    </section>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <button class="lightbox-close" aria-label="Close lightbox">&times;</button>
        <button class="lightbox-prev" aria-label="Previous image">&lt;</button>
        <button class="lightbox-next" aria-label="Next image">&gt;</button>
        <div class="lightbox-content">
            <img id="lightboxImage" src="" alt="">
            <div class="lightbox-caption" id="lightboxCaption"></div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
